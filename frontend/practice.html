<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Hub - PrepFlow AI</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>

    <main style="max-width:1100px; margin:2rem auto; padding:0 1.5rem; flex:1; width:100%;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:2rem;">
            <div>
                <h1 style="font-size:2rem; font-weight:800;">Curated Practice Problems</h1>
                <p style="color:var(--text-secondary);">Practice DSA & System Design problems linked to external judges (LeetCode, GFG, HackerRank) and track your status.</p>
            </div>
            
            <div style="display:flex; gap:0.75rem;">
                <select id="practiceCategoryFilter" onchange="loadPracticeQuestions()" class="speed-select" style="padding:0.5rem 0.8rem; font-weight:600;">
                    <option value="">All Categories</option>
                    <option value="dsa">DSA</option>
                    <option value="system-design">System Design</option>
                </select>
                <select id="practiceDifficultyFilter" onchange="loadPracticeQuestions()" class="speed-select" style="padding:0.5rem 0.8rem; font-weight:600;">
                    <option value="">All Difficulties</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
        </div>

        <div id="practiceQuestionsList"></div>
    </main>

    <script src="/static/js/api.js?v=2.2"></script>
    <script src="/static/js/auth.js?v=2.2"></script>
    <script src="/static/js/navbar.js?v=2.2"></script>
    <script src="/static/js/practice.js?v=2.2"></script>
</body>
</html>
