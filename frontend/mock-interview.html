<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview - PrepFlow AI</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/ai-chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>

    <main style="max-width:900px; margin:2rem auto; padding:0 1.5rem; flex:1; width:100%;">
        <div style="margin-bottom:2rem; text-align:center;">
            <span class="badge badge-medium" style="font-size:0.85rem; padding:0.4rem 1rem; margin-bottom:0.75rem;">🎙️ Interactive Simulation</span>
            <h1 style="font-size:2.2rem; font-weight:800;">AI Conversational Mock Interview</h1>
            <p style="color:var(--text-secondary); max-width:650px; margin:0.3rem auto 0 auto;">Simulate live technical & behavioral interviews. The AI asks follow-up questions based on your responses and generates a comprehensive analytical report.</p>
        </div>

        <!-- SETUP CARD -->
        <div class="card" id="mockSetupCard" style="max-width:600px; margin:0 auto; padding:2rem;">
            <div style="margin-bottom:1.5rem;">
                <label style="display:block; font-weight:700; margin-bottom:0.4rem;">Select Interview Track</label>
                <select id="mockTypeSelect" class="form-control" style="padding:0.75rem;">
                    <option value="dsa">DSA & Algorithms Interview</option>
                    <option value="system-design">System Design Architecture Interview</option>
                    <option value="cs-fundamentals">CS Fundamentals & Database Interview</option>
                    <option value="behavioral">HR & Behavioral Interview</option>
                </select>
            </div>

            <div style="margin-bottom:2rem;">
                <label style="display:block; font-weight:700; margin-bottom:0.4rem;">Difficulty Level</label>
                <select id="mockDifficultySelect" class="form-control" style="padding:0.75rem;">
                    <option value="Beginner">Beginner / Entry Level</option>
                    <option value="Intermediate" selected>Intermediate / SDE-1</option>
                    <option value="Advanced">Advanced / Senior SDE</option>
                </select>
            </div>

            <button onclick="startMockInterview()" class="btn btn-primary" style="width:100%; padding:0.9rem; font-size:1rem;">Start Live Mock Interview 🎙️</button>
        </div>

        <!-- LIVE CHAT CARD -->
        <div class="card" id="mockChatCard" style="display:none; padding:1.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:1rem; margin-bottom:1rem;">
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <span style="font-size:1.2rem;">🎙️</span>
                    <strong style="font-size:1.05rem;">Mock Interview Session In Progress</strong>
                </div>
                <button onclick="finishMockInterviewEarly()" class="btn btn-sm btn-outline">End & Generate Report</button>
            </div>

            <div id="mockChatContainer" style="min-height:300px; max-height:450px; overflow-y:auto; padding:1rem; background:var(--bg-primary); border-radius:var(--radius-md); display:flex; flex-direction:column; gap:1rem; margin-bottom:1rem;"></div>

            <div style="display:flex; gap:0.5rem;">
                <input type="text" id="mockUserInput" class="ai-input" placeholder="Type your technical answer here..." onkeydown="if(event.key==='Enter') sendMockAnswer()">
                <button onclick="sendMockAnswer()" class="btn btn-primary">Submit Answer</button>
            </div>
        </div>

        <!-- REPORT CARD -->
        <div id="mockReportCard" style="display:none;"></div>
    </main>

    <script src="/static/js/api.js?v=2.2"></script>
    <script src="/static/js/auth.js?v=2.2"></script>
    <script src="/static/js/navbar.js?v=2.2"></script>
    <script src="/static/js/voice.js?v=2.2"></script>
    <script src="/static/js/mock-interview.js?v=2.2"></script>
</body>
</html>
