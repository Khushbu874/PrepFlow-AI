<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - PrepFlow AI</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, rgba(59, 130, 246, 0.08) 0%, transparent 60%), var(--bg-primary);
            overflow-y: auto;
        }
        .auth-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.75rem 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 1.25rem;
        }
        .auth-brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            font-size: 1.45rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            margin: 0 auto 0.6rem auto;
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.3);
        }
        .auth-header h2 {
            font-size: 1.45rem;
            font-weight: 700;
            margin: 0 0 0.25rem 0;
            color: var(--text-primary);
        }
        .auth-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0;
        }
        .form-group {
            margin-bottom: 0.9rem;
        }
        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
        }
        .form-input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-input-wrapper .form-input {
            padding-right: 2.4rem;
        }
        .toggle-password-btn {
            position: absolute;
            right: 0.5rem;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.3rem;
            border-radius: var(--radius-sm);
            transition: color 0.2s, background-color 0.2s;
        }
        .toggle-password-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }
        .error-banner {
            display: none;
            padding: 0.55rem 0.85rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            margin-bottom: 0.9rem;
        }
        .auth-footer {
            margin-top: 1.15rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--accent-blue);
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand-logo">P</div>
                <h2>Welcome Back</h2>
                <p>Log in to continue your DSA prep</p>
            </div>

            <div id="errorBanner" class="error-banner"></div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" required class="form-input" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" required class="form-input" placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Show password" title="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-off-icon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; padding:0.7rem; font-size:0.95rem; margin-top:0.35rem;">
                    Log In →
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Create an Account</a>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navbar.js"></script>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const eyeIcon = btn.querySelector('.eye-icon');
            const eyeOffIcon = btn.querySelector('.eye-off-icon');

            if (input.type === 'password') {
                input.type = 'text';
                if (eyeIcon) eyeIcon.style.display = 'none';
                if (eyeOffIcon) eyeOffIcon.style.display = 'block';
                btn.setAttribute('aria-label', 'Hide password');
            } else {
                input.type = 'password';
                if (eyeIcon) eyeIcon.style.display = 'block';
                if (eyeOffIcon) eyeOffIcon.style.display = 'none';
                btn.setAttribute('aria-label', 'Show password');
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errBanner = document.getElementById('errorBanner');
            const submitBtn = document.getElementById('submitBtn');

            errBanner.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Logging in...';

            try {
                await loginUser(email, password);
            } catch(err) {
                errBanner.innerText = err.message || "Invalid credentials. Please try again.";
                errBanner.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Log In →';
            }
        }
    </script>
</body>
</html>
