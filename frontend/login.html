<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - PrepFlow AI</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, rgba(59, 130, 246, 0.08) 0%, transparent 60%), var(--bg-primary);
            overflow-y: auto;
        }
        .auth-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.75rem 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 1.25rem;
        }
        .auth-brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            font-size: 1.45rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            margin: 0 auto 0.6rem auto;
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.3);
        }
        .auth-header h2 {
            font-size: 1.45rem;
            font-weight: 700;
            margin: 0 0 0.25rem 0;
            color: var(--text-primary);
        }
        .auth-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0;
        }
        .form-group {
            margin-bottom: 0.9rem;
        }
        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
        }
        .form-input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .error-banner {
            display: none;
            padding: 0.55rem 0.85rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            margin-bottom: 0.9rem;
        }
        .auth-footer {
            margin-top: 1.15rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--accent-blue);
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand-logo">P</div>
                <h2>Welcome Back</h2>
                <p>Log in to continue your DSA prep</p>
            </div>

            <div id="errorBanner" class="error-banner"></div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" required class="form-input" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required class="form-input" placeholder="••••••••">
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; padding:0.7rem; font-size:0.95rem; margin-top:0.35rem;">
                    Log In →
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Create an Account</a>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navbar.js"></script>

    <script>
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errBanner = document.getElementById('errorBanner');
            const submitBtn = document.getElementById('submitBtn');

            errBanner.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Logging in...';

            try {
                await loginUser(email, password);
            } catch(err) {
                errBanner.innerText = err.message || "Invalid credentials. Please try again.";
                errBanner.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Log In →';
            }
        }
    </script>
</body>
</html>
